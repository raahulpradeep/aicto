[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicto"
version = "0.1.0"
description = "AI CTO orchestrator — persistent agent processes for autonomous development teams"
requires-python = ">=3.11"
dependencies = [
    "watchdog>=3.0",
    "rich>=13.0",
    "textual>=0.50",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/aicto"]
